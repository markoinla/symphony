name: Deploy Workers

on:
  push:
    branches: [main]
    paths:
      - 'workers/**'
      - 'scripts/deploy-workers.sh'
      - 'scripts/smoke-dispatch.sh'
      - '.github/workflows/workers-deploy.yml'

concurrency:
  group: workers-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.worker }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        worker: [sandbox-dispatcher, linear-agent]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            workers/sandbox-dispatcher/package-lock.json
            workers/linear-agent/package-lock.json
            workers/linear-agent/dashboard/package-lock.json

      - name: Install dependencies
        working-directory: workers/${{ matrix.worker }}
        run: npm ci

      - name: Install dashboard dependencies
        if: matrix.worker == 'linear-agent'
        working-directory: workers/linear-agent/dashboard
        run: npm ci

      - name: Typecheck
        working-directory: workers/${{ matrix.worker }}
        run: npm run typecheck

      - name: Test
        working-directory: workers/${{ matrix.worker }}
        run: npm test

  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: test
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      LINEAR_AGENT_ADMIN_TOKEN: ${{ secrets.LINEAR_AGENT_ADMIN_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            workers/sandbox-dispatcher/package-lock.json
            workers/linear-agent/package-lock.json
            workers/linear-agent/dashboard/package-lock.json

      - name: Install sandbox-dispatcher deps
        working-directory: workers/sandbox-dispatcher
        run: npm ci

      - name: Install linear-agent deps
        working-directory: workers/linear-agent
        run: npm ci

      - name: Install linear-agent dashboard deps
        working-directory: workers/linear-agent/dashboard
        run: npm ci

      - name: Deploy workers + smoke gate
        run: ./scripts/deploy-workers.sh
